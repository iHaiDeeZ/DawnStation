# Nickelodeon Barnyard (SLUS-21277).
# The game builds its textures on the GS (Blue Tongue's engine, PCSX2's GSC_BlueTongueGames): layers drawn as sprites
# through A+D against a dither pattern used as a depth buffer, then each mip level drawn from the one before it. The
# full-size level stays dithered on purpose; the game samples the smooth mip levels (TEX1 K = 6), so the core's mipmap
# mode must stay on (the Mipmaps option, recommended on; 1.10 without it showed the dither stripes everywhere).
# Drawing mip level n+1 from level n needs the GS to finish level n first: PCSX2 needs autoFlush ("needed for recursive
# mipmap rendering") for this game. Sony's core keeps A+D sprites in one batch unless --gs-flush-ad-xyz says otherwise
# (the A+D XYZ handler, core+0x8E8B46: None 0, Safe 1, Always 2, SafeZWrite 3). 1.11-1.13 had SafeZWrite, which only
# flushes a sprite drawn into its own depth buffer (FRAME page = ZBUF page); this game's texture-building sprites draw
# into a texture page with the dither buffer elsewhere (FRAME 0x38E0, ZBUF 0x1180), so it never flushed them. Safe only
# flushes a sprite that reads its own target's base. Always (1.14) flushes the pending draws before every A+D vertex:
# each layer and mip level is drawn after the ones before it are done, as on the PS2.
# Since 2026-11-04 (after 1.22): None. The tree garbage was the core's mip level widths (menu.c "Mip level widths",
# 1.22), not the order of these draws. With that fixed, None drew the same frames as Always (switched live in the Lab:
# at the farm, and paused at the forest trees, where only animation differed) and ran ~6% faster at a light spot
# (58 against 55 flips/s); Safe was no faster than Always.
--gs-flush-ad-xyz=None
