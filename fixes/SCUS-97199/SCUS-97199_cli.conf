# Ratchet & Clank (SCUS-97199): as Ratchet & Clank 2's fix (fixes/SCUS-97268/SCUS-97268_cli.conf, where the
# reasons are): VU0 programs charge the EE 50 cycles each (the stubs start one on every handshake), and VIF1's
# VIFcode interrupt bits are ignored.
--vu0-mpg-cycles=50
--vif1-ignore-cmd-ints=1
