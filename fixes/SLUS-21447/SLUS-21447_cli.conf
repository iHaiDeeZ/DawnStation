# Guitar Hero II (USA) [SLUS-21447]: DawnStation's fix (2026-11-27, Lab), for the Jak X core. The folder's
# vif1_mfifo_wait file is the start fix: the core runs the game's VIF1 chains through its generic path, which waits at
# the MFIFO's producer (without it the game stays black before its first frame). The game sends all its GS data
# through the MFIFO (fromSPR fills a 512 KB ring at 0xA00000, VIF1 drains it) and polls the DMA registers while it
# waits; each poll moved the PS2's clock only a little, so the PS2 ran at 40% (24 fps in a song, slow sound). These are
# Sony's settings for the same MFIFO in Red Dead Revolver (its PS4 config): the MFIFO drain run and the EE clock moved
# on where the game waits (sceGsSyncPath's VIF1 wait 0x2F0274, its wait for room in the ring 0x3D7DD0), the clock also
# moved on in its wait for a DMA channel (0x3D7E80), and a drain every 0.3 frames instead of a wake for every fromSPR
# copy. In a song the game also writes into memory pages that hold recompiled code: the EE recompiler threw away and
# recompiled those pages' code over and over (two thirds of the EE thread in mprotect and sigprocmask, 22-32 fps). The
# page-fault threshold leaves a page unprotected after 20 such faults (Sony's Jak & Daxter value, as in The Simpsons
# Game's fix). Tested on a PS4 Pro (Lab, live): the menus at 60 fps; in a song the threshold took it from 32 to 60 fps,
# the PS2 at full speed.
--ee-jit-pagefault-threshold=20
--ee-hook=0x2F0274,FastForwardClock,0x8c620000
--ee-hook=0x2F0274,MfifoDrain,0x8c620000
--ee-hook=0x3D7DD0,FastForwardClock,0x8cc20000
--ee-hook=0x3D7DD0,MfifoDrain,0x8cc20000
--ee-hook=0x3D7E80,FastForwardClock,0x8c820000
--mfifo-manual-drain=0.30
--mfifo-chunk-drain-cycles=210000
