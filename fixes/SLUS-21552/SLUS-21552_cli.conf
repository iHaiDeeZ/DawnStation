# Spider-Man 3 (SLUS-21552): DawnStation's fix (see SLUS-21552_config.lua for the loading freeze).
#
# The stalls (1 s every few seconds, 16-24 fps): Sony's VU1 recompiler threw all its code away 2-4
# times every 5 s ("jVU1exec: Issuing full compiler & program cache reset"). The game's engine links
# its VU1 shader pieces in at whatever address is free and jumps between them with JR/JALR. By
# default every compiled JR/JALR gets a "jrCache" site of its own (a table of 2048 code pointers,
# 4096 sites in all), and ~200 programs used them all up in ~1.5 s (DawnStation's profiler,
# 2026-10-25: "jrCache 4096 of 4096" at every reset).
# newprog compiles a jump's target as a program of its own, found by its address and code: no sites,
# each piece compiled once and reused. Tested on the console (2026-10-25): no resets during play,
# compiling 0-3% of the time instead of ~30%, frame gaps 32-70 ms instead of ~1.2 s, 40-60 fps.
--vu1-jr-cache-policy=newprog
--vu1-jalr-cache-policy=newprog
