# Ratchet & Clank 4th: GiriGiri Ginga no Giga Battle (SCPS-19321, Japan, PlayStation 2 the Best): Ratchet: Deadlocked's settings (fixes/SCUS-97465), UNTESTED on this disc.
# psdevwiki has settings for SCUS-97465 only; its game options are here (not its resolution lines, nor its
# AdvanceClock hook at 0xFF904, which the Lua's handshake stubs never reach).
#Fix graphics (psdevwiki)
--gs-use-mipmap=1
--gs-kernel-cl="mipmap"
--gs-kernel-cl-up="mipmap2x2"
#Looping music partial fix (psdevwiki)
--iop-cycle-scalar=0.38
#Fix gravity and other physics (psdevwiki)
--cop2-opt-flags=0
#Fix passage not showing up and glitchy ledge-hanging (psdevwiki)
--cop2-accurate-mul=1
# DawnStation, as Ratchet & Clank 1 and 2: VU0 programs charge the EE 50 cycles each, VIF1's VIFcode interrupt bits ignored
--vu0-mpg-cycles=50
--vif1-ignore-cmd-ints=1
