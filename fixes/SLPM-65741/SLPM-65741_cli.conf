# DRIV3R (Japan) [SLPM-65741]: the USA disc's psdevwiki options (data/wikifix/SLUS-20587.cli) for DawnStation's fix in
# this folder, UNTESTED on this disc (2026-11-08). Without them the VU1 cost would be the core's 100, at which the
# game's two-pass lighting drops the emulation to about a third of full speed; the fix lowers it to 900 once its
# one-pass lighting is in. Left out: --cop2-accurate-addsub-range=0x4b8108,0x4b8408 (psdevwiki: the AI cop car), an
# address range in the USA disc's code.
--vu1-di-bits=0
--vu1-mpg-cycles=2700
--ee-cycle-scalar=1.1
--gs-flush-ad-xyz=always
--gs-use-mipmap=1
--gs-use-clut-merge=1
--gs-kernel-cl-up="up2x2simple"
