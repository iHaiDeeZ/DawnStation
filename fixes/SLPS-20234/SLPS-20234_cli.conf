# Harry Potter to Himitsu no Heya (Japan) [SLPS-20234]: the European English disc's settings (fixes/SLES-51192), untested here.
# Harry Potter and the Chamber of Secrets (SLES-51192, Europe): DawnStation (2026-11-07, Lab), with the Lua's fixes.
# The game reached its first level's loading screen and ended there on a read at 0x8F5A2D44: a NULL structure's field
# read twice, the first read giving the kernel's code at 0x18 (0x8F5A2D40) and the second going past the PS2's memory,
# where core2 ends the app ("BusError read"). With R, such a read gives 0 instead (core2's own option: its EE read slow
# path returns 0 when the option's R bit is set), as the Lua's cleared TLB refill vector does for the first read.
# (Tried and left out: --vif1-instant-xfer=0, psdevwiki's Prisoner of Azkaban line: the game hung on the same loading
# screen, its sound command queue at 0x556D40 waiting for an answer from the IOP that never came.)
--ee-ignore-segfault=R
