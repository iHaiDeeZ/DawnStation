# Guitar Hero II (Europe) [SLES-54442]: the USA disc's fix (fixes/SLUS-21447, where the reasons are), UNTESTED on this
# disc (2026-11-27). The folder's vif1_mfifo_wait file is the start fix (without it the USA disc stays black before
# its first frame). The USA disc's EE hooks, which move the PS2's clock on where the game polls its DMA registers, are
# at that disc's addresses, so they aren't here: this disc may run slower than the USA one in songs. The EE recompiler's
# page-fault threshold (against the code-page thrash in songs) and the MFIFO drain settings, as on the USA disc:
--ee-jit-pagefault-threshold=20
--mfifo-manual-drain=0.30
--mfifo-chunk-drain-cycles=210000
