# Ratchet & Clank 2 (SCUS-97268): the game hands work to VU0 in a handshake (its VU0 program spins
# until the EE clears vi1/vi2; the EE waits for its results). On the PS2 both run side by side; Sony's
# core runs VU0 on the EE's thread, and where the EE needs VU0 idle it ran the program without limit,
# so the whole core stopped. Fixed 2026-10-22 by DawnStation's VU0 cap (vu0_sync_budget in this
# folder, menu module v00.33) and the handshake stubs in SCUS-97268_config.lua: the game plays at
# 60 fps. Built into the app since v00.34, with the game's recommended options in
# data/recommended.ini (VU1 sync and frame generation off). psdevwiki's settings come on top
# (--iop-cycle-scalar=0.38, --cop2-opt-flags=0, its --ee-hook AdvanceClock, which the stubs no
# longer reach). --vu0-mpg-cycles (Sony's own 600 for GTA LCS) was the first thing that got past the
# boot freeze. The core charges the EE that many cycles every time a VU0 program starts, and since
# v00.35 the stubs start one on every handshake, about 30,000 times a frame where enemies are on
# screen: with 600 the game itself fell to 18-27 frames a second at 60 vblanks (it felt slow).
# 2026-10-23, v00.37: 50, tested on the console: a frame every vblank even in busy fights.
--vu0-mpg-cycles=50
# A VIF1 DMA chain that never finished (black screen: EE at 0x2FC3C0 waiting on flag 0x1AD520, VIF1
# stalled on a VIFcode interrupt bit) came before the handshake fix; ignore those interrupt bits.
--vif1-ignore-cmd-ints=1
# Removed 2026-10-22: --vu1=jit-sync (VU1 on the EE's thread): only on because one run got lucky,
# and it costs frame rate (R&C 2 does its 3D work on VU1).
# Tried without effect before the VU0 cap: --detect-idle-chcr=none, --ee-evt-check-full=1,
# --iop-cycle-scalar=1.0, AdvanceClock hooks on the scratchpad DMA waits (0x274E08, 0x274ED0), fresh
# memory cards, no DawnStation hooks, QMFC2.I on the routine's VU0 reads (deadlocks).
