# Scarface: The World Is Yours (USA) [SLUS-21111]: DawnStation's fixes, made in the Lab (2026-11-16/17). Best on the
# Jak X core (the Newer core; the recommended options pick it): full speed there. No options of its own.
# - Black screen after the PS2 logo (Jak X and Wild ARMs cores): the game sends all its GS data through the MFIFO (a
#   ring buffer that VIF1 drains), so VIF1's DMA never ends, and Sony's cores hold each frame's FINISH (a VIF1 DIRECT
#   packet) until that transfer ends; the game waits for CSR.FINISH before every frame (0x635BC0). vif1_finish_now (1):
#   the in-game menu module has the core raise FINISH when the GS gets it (overlay/menu.c, "FINISH at once": 49 places
#   on the Jak X core, 29 on the Wild ARMs core).
# - Frame rate dips in play (Jak X core): the game writes each object's 4x4 matrix into VU1 code (18-instruction
#   routines at VU1 1542, 1560, ...) with every batch, so the core's VU1 recompiler compiled about 2,500 of them a
#   second and threw all its code away 12-14 times every 5 s; recompiling the game's real programs after each of those
#   stalled 100-200 ms. vu1_matrix (1): the module runs those routines at VU1's lookups instead (overlay/menu.c, "VU1
#   matrix routines"): in the same scene, 300 frames every 5 s with none late (6-7 were 58 ms or more before).
# The Wild ARMs core interprets this game (nothing compiled ahead for it): intros and cutscenes ran at about 15 fps.
# The Bully core doesn't have the FINISH code.
