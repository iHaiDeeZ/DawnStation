# Ratchet & Clank 3 (SCES-52456, PAL): Ratchet & Clank: Up Your Arsenal's settings (fixes/SCUS-97353), UNTESTED on this
# disc. psdevwiki has settings for SCUS-97353 only; its game options are here (not its resolution lines, nor its
# AdvanceClock hook at 0xFF904, which the Lua's handshake stubs never reach).
#Fix graphics (psdevwiki)
--gs-use-mipmap=1
--gs-kernel-cl="mipmap"
--gs-kernel-cl-up="mipmap2x2"
#Looping music partial fix (psdevwiki)
--iop-cycle-scalar=0.38
#Fix gravity and other physics (psdevwiki)
--cop2-opt-flags=0
# DawnStation, as Ratchet & Clank 1 and 2: VU0 programs charge the EE 50 cycles each, VIF1's VIFcode interrupt bits ignored
--vu0-mpg-cycles=50
--vif1-ignore-cmd-ints=1
