# Seiken Densetsu 4 (Japan) [SLPM-66576]: Dawn of Mana's emulator settings (fixes/SLUS-21574, the user's config for
# the USA disc, made on the Jak X v2 emulator), UNTESTED on this disc (2026-11-17). The game's Options replace a line's
# value when set: Resolution, Upscale filter, Float clamping, Disc read speed.
