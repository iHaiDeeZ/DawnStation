# Neopets: The Darkest Faerie (USA) [SCUS-97367] (2026-11-28, tested on the PS4 Pro with VU1 sync on).
# No emulator options here: the fix is this folder's vu1_cmsar1 file, a switch for a fix in DawnStation's in-game
# module (from 1.58) that only works on the Jak X core (Core 1, the game's automatic choice).
# What was wrong: right after the intro the game starts a VU1 program from the EE itself (it writes VU1's start
# address to CMSAR1) instead of through VIF1. The Jak X core then queues two entries its usual VU1 reader doesn't
# know: the reader lost its place in its queue and the emulator crashed. With those entries read, the core still
# never ran that program (only its timed path does), so the game waited for VU1 for ever. DawnStation's module adds
# the missing entries to the reader and runs VU1 when the start address is written.
