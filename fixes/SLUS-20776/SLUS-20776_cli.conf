# Spider-Man 2 (SLUS-20776): DawnStation's fix (v00.41). The user's test 1 on the console
# (2026-10-23): with these and Resolution Native, the thin lines across rooftops and in cutscenes
# were gone (at 2x they're a seam between two big triangles), at 60 fps. Native is in the game's
